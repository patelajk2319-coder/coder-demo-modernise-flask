version: '3'

tasks:

  run:
    desc: Run the API locally with the Flask dev server, no Docker
    cmds:
      - python app.py

  test:
    desc: Run the test suite
    cmds:
      - pytest

  build:
    desc: Build the Docker image (tagged with VERSION and latest) and (re)run it
    cmds:
      - docker build -t coder-demo-modernise-flask:$(cat VERSION) -t coder-demo-modernise-flask:latest .
      - docker rm -f coder-demo-modernise-flask-demo 2>/dev/null || true
      - docker run -d --name coder-demo-modernise-flask-demo -p 8000:8000 coder-demo-modernise-flask:latest
      - |
        if [ -n "${CODER_WORKSPACE_NAME:-}" ]; then
          printf '\033[1;33mRunning in a Coder workspace — from your laptop:\033[0m\n'
          printf '\033[1;33m  coder port-forward %s --tcp 8000:8000\033[0m\n' "${CODER_WORKSPACE_NAME}"
          printf '\033[1;33mthen open http://localhost:8000/items\033[0m\n'
        else
          printf '\033[1;33mAPI running at http://localhost:8000/items\033[0m\n'
        fi

  stop:
    desc: Stop and remove the running container
    cmds:
      - docker rm -f coder-demo-modernise-flask-demo

  release:
    desc: Tag and push the current VERSION as a git release (vX.Y.Z)
    cmds:
      - git tag "v$(cat VERSION)"
      - git push origin "v$(cat VERSION)"
